<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
    <title>Music Player</title>
</head>

<body>
    <div class="outerContainer">
        <div class="innerContainer">
            <div>
                <img class="albumCover" src="public\aquaregia.png">
                <div class="musicControls">
                    <button name="previous button" id="previousBtn" type="button"
                        class="material-symbols-outlined">keyboard_double_arrow_left</button>
                    <button name="play button" id="playBtn" type="button"
                        class="material-symbols-outlined">play_circle</button>
                    <button name="foward button" id="fowardBtn" type="button"
                        class="material-symbols-outlined">keyboard_double_arrow_right</button>
                </div>
                <p id="songTitle"> The Title of the song goes here.</p>
                <p id="album"> Album</p>
                <p id="artist"> Artist</p>
            </div>
        </div>
    </div>
